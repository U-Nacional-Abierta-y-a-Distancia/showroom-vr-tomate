<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Showroom VR Cadena Productiva del Tomate · UNAD</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1f2a; font-family: "Segoe UI", Arial, sans-serif; }
      #unity-container { position: absolute; inset: 0; }
      #unity-canvas { width: 100%; height: 100%; display: block; background: #0b1f2a; outline: none; }
      #unity-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #fff; text-align: center; padding: 0 20px; }
      #unity-loading h1 { font-size: 22px; font-weight: 600; margin: 0; }
      #unity-loading p { margin: 0; opacity: .85; font-size: 14px; }
      #unity-bar { width: min(420px, 80vw); height: 10px; background: rgba(255,255,255,.2); border-radius: 5px; overflow: hidden; }
      #unity-bar-full { width: 0; height: 100%; background: #8fd14f; transition: width .2s; }
      #unity-warning { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5; color: #000; }
      #unity-fullscreen { position: absolute; right: 12px; top: 12px; z-index: 4; background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 6px 10px; font-size: 13px; cursor: pointer; display: none; }
      #unity-fullscreen:hover { background: rgba(0,0,0,.75); }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading">
        <h1>Showroom VR Cadena Productiva del Tomate</h1>
        <p>Universidad Nacional Abierta y a Distancia · UNAD</p>
        <div id="unity-bar"><div id="unity-bar-full"></div></div>
        <p id="unity-progress-text">Cargando el recurso, por favor espere…</p>
        <p style="font-size:12px;opacity:.65">Se requiere un navegador con WebGL 2 (Chrome, Edge o Firefox actualizados).</p>
      </div>
      <div id="unity-warning"></div>
      <button id="unity-fullscreen" title="Pantalla completa">⛶ Pantalla completa</button>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var barFull = document.querySelector("#unity-bar-full");
      var progressText = document.querySelector("#unity-progress-text");
      var fullscreenButton = document.querySelector("#unity-fullscreen");
      var warningBanner = document.querySelector("#unity-warning");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #ffb3b3; padding: 10px; border-radius: 6px;';
        else {
          if (type == 'warning') div.style = 'background: #fff3a0; padding: 10px; border-radius: 6px;';
          setTimeout(function() { warningBanner.removeChild(div); updateBannerVisibility(); }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "UNAD",
        productName: "Showroom VR Cadena Productiva del Tomate",
        productVersion: "1.0.0",
        showBanner: unityShowBanner,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          barFull.style.width = (100 * progress) + "%";
          progressText.textContent = "Cargando el recurso… " + Math.round(100 * progress) + " %";
        }).then(function (unityInstance) {
          window.unityInstance = unityInstance;
          loading.style.display = "none";
          fullscreenButton.style.display = "block";
          fullscreenButton.onclick = function () { unityInstance.SetFullscreen(1); };
          canvas.focus();
        }).catch(function (message) {
          progressText.textContent = "No fue posible iniciar el recurso: " + message;
          progressText.style.color = "#ffb3b3";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
